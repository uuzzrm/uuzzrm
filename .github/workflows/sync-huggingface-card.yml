name: Sync profile card to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/profile-header.svg"
      - "assets/account-stars-light.svg"
      - "assets/account-stars-dark.svg"
      - ".github/workflows/sync-huggingface-card.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-profile-card
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Prepare public Hugging Face card
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _huggingface-card
          cp README.md _huggingface-card/README.md
          {
            printf '%s\n' '---'
            printf '%s\n' 'tags:'
            printf '%s\n' '- ai-agents'
            printf '%s\n' '- developer-tools'
            printf '%s\n' '- image-models'
            printf '%s\n' '- evaluation'
            printf '%s\n' '- retrieval'
            printf '%s\n' '---'
            printf '\n'
            cat README.md
          } > _huggingface-card/README.md

      - name: Detect Hugging Face publication configuration
        id: huggingface
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -n "$HF_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN is not configured; the source card was prepared but not published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up the Hugging Face CLI
        if: steps.huggingface.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Sync the card to Hugging Face
        if: steps.huggingface.outputs.enabled == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          uvx hf repos create uuzzrm/README --repo-type model --exist-ok --token "$HF_TOKEN"

          for attempt in 1 2 3; do
            if uvx hf upload \
              uuzzrm/README \
              _huggingface-card/README.md \
              README.md \
              --repo-type model \
              --token "$HF_TOKEN" \
              --commit-message="Sync profile card from GitHub $GITHUB_SHA" \
              --format json; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          echo "Hugging Face profile-card upload failed after three attempts." >&2
          exit 1
