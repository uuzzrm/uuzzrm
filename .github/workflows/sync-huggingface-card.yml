name: Sync profile card to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/profile-header.svg"
      - "assets/account-stars-light.svg"
      - "assets/account-stars-dark.svg"
      - ".github/workflows/sync-huggingface-card.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-profile-card
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Prepare public Hugging Face card
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _huggingface-card
          cp README.md _huggingface-card/README.md
          {
            printf '%s\n' '---'
            printf '%s\n' 'tags:'
            printf '%s\n' '- ai-agents'
            printf '%s\n' '- developer-tools'
            printf '%s\n' '- image-models'
            printf '%s\n' '- evaluation'
            printf '%s\n' '- retrieval'
            printf '%s\n' '---'
            printf '\n'
            cat README.md
          } > _huggingface-card/README.md

      - name: Detect Hugging Face publication configuration
        id: huggingface
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -n "$HF_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN is not configured; the source card was prepared but not published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up the Hugging Face CLI
        if: steps.huggingface.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Sync the card to Hugging Face
        if: steps.huggingface.outputs.enabled == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          uv run --no-project --with huggingface_hub==1.27.0 python - <<'PY'
          import os
          import time
          from io import BytesIO
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          from huggingface_hub import CommitOperationAdd, HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = "uuzzrm/README"
          desired = Path("_huggingface-card/README.md").read_bytes()
          api = HfApi(token=token)
          api.create_repo(repo_id=repo_id, repo_type="model", exist_ok=True)

          for attempt in range(12):
              try:
                  api.model_info(repo_id)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)

          remote = None
          request = Request(
              f"https://huggingface.co/{repo_id}/raw/main/README.md",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              with urlopen(request) as response:
                  remote = response.read()
          except HTTPError as error:
              if error.code != 404:
                  raise

          if remote == desired:
              print("Hugging Face profile card is already current.")
          else:
              commit = api.create_commit(
                  repo_id=repo_id,
                  repo_type="model",
                  operations=[
                      CommitOperationAdd(
                          path_in_repo="README.md",
                          path_or_fileobj=BytesIO(desired),
                      )
                  ],
                  commit_message=f"Sync profile card from GitHub {os.environ['GITHUB_SHA']}",
              )
              print(commit.commit_url)
          PY
